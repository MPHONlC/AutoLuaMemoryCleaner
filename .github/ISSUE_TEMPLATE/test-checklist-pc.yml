name: "\u2705 Auto Lua Memory Cleaner Test Checklist (PC)"
description: Run through Auto Lua Memory Cleaner's PC test checklist and report results
title: '[TEST][PC] '
labels:
- testing
assignees:
- MPHONlC
body:
- type: markdown
  attributes:
    value: Thanks for testing **Auto Lua Memory Cleaner** on PC! Check off everything you actually tested and confirmed working. Anything broken or partly working, describe it in the notes field at the end instead of checking it off.
- type: input
  id: version
  attributes:
    label: Add-on version
    placeholder: e.g. 2026.09.29.21.48
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform
    options:
    - PC (NA)
    - PC (EU)
    - PC (PTS)
  validations:
    required: true
- type: checkboxes
  id: pc_tests
  attributes:
    label: PC tests confirmed working
    options:
    - label: 'Wizard: First install (or /alcwizard): step through with Use Default on every step.'
    - label: 'Wizard welcome: On a fresh install the Welcome dialog shows: press Skip. Then run /alcwizard and press Quick Setup.'
    - label: 'Wizard yes or no: Run /alcwizard and answer No to chat logs (keyboard mode only), center-screen notices, the status UI and pool cleanup; run it again and answer Yes to each.'
    - label: 'Wizard custom: Run /alcwizard, reach Cleanup Method, pick Customize, Customize again, then Forced Cleanup, then Deep Clean.'
    - label: 'Wizard thresholds: Run /alcwizard. On the Lua threshold, Lua delay, pool threshold and pool delay steps pick Customize, then Low or High for the thresholds, Short or Long for the delays.'
    - label: 'Cleanup Method: Open Settings > Add-Ons > Auto Lua Memory Cleaner > Cleanup Settings. Open the Cleanup Method dropdown.'
    - label: 'Background: Set Background, then /alcclean.'
    - label: 'Aggressive: Set Aggressive, then /alcclean.'
    - label: 'Deep Clean: Set Deep Clean, then /alcclean.'
    - label: 'Automatic: Set Automatic. Play normally past the threshold, then open a menu such as the inventory and wait.'
    - label: 'Vanilla: Set Vanilla and play normally past the threshold for a while.'
    - label: 'Command: Type /alccleanupmode five times.'
    - label: 'Auto Lua Cleanup: Turn Auto Lua Cleanup off, then back on. Also toggle it with /alcon, which says ON or OFF.'
    - label: 'PC Lua Threshold: Move the PC Lua Threshold (MB) slider to its lowest value (50) and highest (800).'
    - label: 'Lua Cleanup Delay: Set Lua Cleanup Delay (Seconds) to 30, run /alcclean, then push memory past the threshold again inside 30 seconds and after it. Also try 1200.'
    - label: 'Cleanup growth: Set Min. Growth Since Last Cleanup (MB) to 10 and Min. Growth Since Last Cleanup (%) to 0, let Lua grow about 5 MB past the last cleanup, then past 10 MB.'
    - label: 'Auto cleanup: With Auto Lua Cleanup on, let Lua memory pass the PC Lua threshold, then leave combat or open a menu.'
    - label: 'Combat and death: With memory above the threshold, get into combat (or die) and watch the status window.'
    - label: 'Pool reload: Turn on Reload After Loading Screen When Memory Is Bloated with Lua memory still above the PC Reload Threshold (MB) after a cleanup and grown by at least 2 MB since login, then use a wayshrine.'
    - label: 'Pool floor: Right after logging in, with memory above the threshold but not grown, travel.'
    - label: 'Pool confirm: Turn on Ask Before Reloading After a Loading Screen and travel with a grown pool. Do it once with the checkbox off.'
    - label: 'Group activities: With Reload After Loading Screen When Memory Is Bloated on and memory above the threshold, zone into a group dungeon, a trial or arena, a battleground, Cyrodiil and the Infinite Archive, and travel while queued for an activity.'
    - label: 'Pool commands: Type /alcpoolreload and /alcpoolconfirm with Reload After Loading Screen When Memory Is Bloated on; turn it off and check /alcpoolconfirm is no longer a command.'
    - label: 'Pool sliders: Turn on Reload After Loading Screen When Memory Is Bloated, then move the PC Reload Threshold (MB) slider (100 to 1500) and the Reload Delay (Seconds) slider.'
    - label: 'Pool reload cooldown: Turn on Reload After Loading Screen When Memory Is Bloated (it is off by default), set Minimum Time Between Reloads (Minutes) to 10, then travel twice within 10 minutes with memory a cleanup cannot bring down. Also try 180.'
    - label: 'Reload When AFK: Turn it on and set AFK Time Before Reload (Minutes) to 3. Stand still on the HUD for 3 minutes and keep standing; then move, open the inventory for 2 minutes, close it and wait. Also stand still in a group dungeon or trial.'
    - label: 'Garbage Check: Set the PC Lua Threshold (MB) above your memory and Lua Cleanup Delay (Seconds) to 30, keep Chat Logs on and wait two minutes out of combat; then turn Garbage Check Ignores Min. Growth on; then try Vanilla.'
    - label: 'Center Screen Announcements: Turn Center Screen Announcements off and on (or /alccsa, which says ON or OFF). Run /alcclean when there is something to clean and again right after.'
    - label: 'Chat Logs: Turn Chat Logs off and on (or /alclogs, which says ON or OFF). Run /alcclean twice.'
    - label: 'Manual cleanup: Open Advanced Settings and press MANUAL CLEANUP.'
    - label: 'Show UI: Turn Show UI off, then on (or /alcui). With it off, look for the window.'
    - label: 'Render in menus: Toggle Render UI in Menus and open a menu.'
    - label: 'Window drag: Drag the status window by its body to another spot, then /reloadui.'
    - label: 'Lock UI Position: Turn Lock UI Position on (or /alclock) and try to drag the window; turn it off and drag again. With Show UI off, /alclock and /alcreset are not commands.'
    - label: 'UI Scale: Move the UI Scale slider from 0.5 to 2.0.'
    - label: 'Resize: Drag the window corner bigger and smaller.'
    - label: 'Reset UI position: Drag the window somewhere else, then press RESET UI POSITION (or /alcreset).'
    - label: 'Reset UI: Resize the UI and then, press the RESET UI SIZE button to reset.'
    - label: 'Status text: Look at the window for a while, run /alcclean, then wait.'
    - label: 'Module Manager: /alcunloadui, reload, then /alcunloadui again and reload.'
    - label: 'Module Manager files: /alcunloadwizard, /alcunloadmenu and /alcunloadmigration one at a time (reload each time), then repeat each once more. Also try the Module Manager buttons in settings and the Reload UI button.'
    - label: 'Client Info: Open Client Information in settings.'
    - label: 'Commands Info: Open Commands Info in settings and compare it with /alc.'
    - label: 'Commands: Type /alc.'
    - label: 'Command aliases: Type each alias: /autoluaclean, /alcenable, /alctoggleui, /alcuilock, /alcuireset, /alctogglecsa, /alcchatlogs, /alccleanup, /alcwipe.'
    - label: 'Mail button: In settings press Mail @APHONlC (not shown on the EU server).'
    - label: 'Bug report button: Press BUG REPORT in settings, and also type /alcbugreport and /alcbug.'
    - label: 'Submenu memory: Open UI Configuration, Advanced Settings and Module Manager, close the panel, reload and reopen it.'
    - label: 'Reset: Change some settings and press RESET TO DEFAULTS in Advanced Settings.'
    - label: 'Reset command: Change some settings and type /alcdelvars.'
    - label: 'Library Warning: Disable an optional library (LibAddonMenu-2.0 on PC, LibHarvensAddonSettings on console), then enable the Library warning checkbox.'
    - label: 'Library warning toggle: Type /alclibwarn twice.'
    - label: 'Dangerous buttons: Hover the warning icons next to Reset UI Position, Reset UI Size and Reset to Defaults, then click one.'
- type: textarea
  id: notes
  attributes:
    label: Anything broken, partly working, or not tested
    description: 'One line per issue: which test, what happened instead of Expected.'
    placeholder: 'e.g. PC-L-04 Bug report: popup opened but API version line was blank'
